# 새김AI Atelier 터널

tunnel: <터널ID>
credentials-file: C:/Users/Microsoft/.cloudflared/<터널ID>.json

ingress:
  # 공개 — 갤러리가 작품과 이미지를 가져가는 자리
  - hostname: api.saegimai.com
    service: http://127.0.0.1:8787

  # 개인 — 만들기 콘솔. 서버 자체의 로그인이 막습니다.
  - hostname: studio.saegimai.com
    service: http://127.0.0.1:8788

  # 위에 안 걸리는 요청은 전부 막습니다. 이 줄은 반드시 마지막에 있어야 합니다.
  - service: http_status:404
