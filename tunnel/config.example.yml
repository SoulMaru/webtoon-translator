# Cloudflare Tunnel 설정 본보기.
# 이 파일을 C:\Users\<사용자>\.cloudflared\config.yml 로 복사해서 쓰십시오.
# <터널ID> 두 군데를 실제 값으로 바꿔야 합니다. (docs/02-터널-연결.md 참고)

tunnel: <터널ID>
credentials-file: C:\Users\Microsoft\.cloudflared\<터널ID>.json

ingress:
  # 바깥에서 api.saegimai.com 을 부르면 내 PC의 로컬 API로 이어 줍니다.
  - hostname: api.saegimai.com
    service: http://127.0.0.1:8787

  # 위에 안 걸리는 요청은 전부 막습니다. 이 줄은 반드시 마지막에 있어야 합니다.
  - service: http_status:404
